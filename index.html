<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Çekirdek Coffee</title>
<meta name="description" content="Mahalle arasında küçük bir 3. dalga kahveci aç, caddenin en sevilen dükkanı yap.">
<meta name="theme-color" content="#1f4f3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Çekirdek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="overlay"></div>
<div id="top">
  <div id="hud">
    <div class="chip brand" id="brand">☕ ÇEKİRDEK</div>
    <div class="chip money" id="money"></div>
    <div class="chip" id="rating"></div>
    <div class="chip" id="clock"></div>
    <div class="chip" id="weather"></div>
    <div class="chip event" id="eventChip" style="display:none"></div>
    <div class="chip" id="stock"></div>
  </div>
  <div id="controls">
    <button data-speed="0" title="Duraklat (Boşluk)">⏸</button>
    <button data-speed="1" class="active">1×</button>
    <button data-speed="2">2×</button>
    <button data-speed="4">4×</button>
    <span class="sep"></span>
    <button data-tab="staff" title="Personel">👥<span class="lbl"> Personel</span></button>
    <button data-tab="menu" title="Menü">📋<span class="lbl"> Menü</span></button>
    <button data-tab="stock" title="Stok">📦<span class="lbl"> Stok</span></button>
    <button data-tab="upgrades" title="Geliştir">⬆️<span class="lbl"> Geliştir</span></button>
    <button data-tab="street" title="Cadde ve şubeler">🏠<span class="lbl"> Cadde</span></button>
    <button data-tab="hood" title="Mahalle">👋<span class="lbl"> Mahalle</span></button>
    <button data-tab="decor" title="Dekor">🎨<span class="lbl"> Dekor</span></button>
    <button data-tab="reviews" title="Yorumlar">💬<span class="lbl"> Yorumlar</span></button>
    <button data-tab="stats" title="İstatistik">📊<span class="lbl"> İstatistik</span></button>
    <button data-tab="goals" title="Hedefler">🎯<span class="lbl"> Hedefler</span></button>
    <button data-tab="settings" title="Ayarlar">⚙️</button>
    <button id="btnPhoto" class="icon" title="Fotoğraf çek (P)">📷</button>
  </div>
</div>
<div id="tracker"></div>
<div id="panel"></div>
<div id="shop"></div>
<div id="hint"><span id="hintText"></span><button id="hintRot" title="Döndür (R)">↻<span class="lbl"> Döndür</span></button><button id="hintCancel">✕</button></div>
<div id="artGame"><b>🎨 Latte art! Yeşilin ortasında dokun</b><div id="artTrack"><div id="artZone"></div><div id="artPerfect"></div><div id="artNeedle"></div></div><small>Koyu yeşil = mükemmel</small></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
