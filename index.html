<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Çekirdek Coffee</title>
<meta name="description" content="Mahalle arasında küçük bir 3. dalga kahveci aç, caddenin en sevilen dükkanı yap.">
<meta name="theme-color" content="#efe7dc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Çekirdek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="overlay"></div>

<header id="topbar">
  <div class="row">
    <button class="pill round" id="pauseBtn" title="Duraklat (Boşluk)">⏸</button>
    <button class="pill speed" id="speedBtn" title="Oyun hızı">1×</button>
    <div class="pill brandpill" id="brand"></div>
    <div class="pill money" id="money"></div>
    <div class="pill" id="rating"></div>
    <button class="pill level" id="levelPill" title="Seviye ve günlük hedefler"></button>
  </div>
  <div class="row">
    <div class="pill" id="clock"></div>
    <button class="pill event" id="eventChip" style="display:none"></button>
    <div class="pill" id="stock"></div>
  </div>
  <div class="row"><button class="pill goal" id="goalChip"></button></div>
</header>

<div id="tracker"></div>
<div id="coach"></div>
<div id="finger"></div>
<button class="fab edit" id="btnEdit" title="Düzenle (E)">✏️<span>Düzenle</span></button>
<button class="fab" id="btnPhoto" title="Fotoğraf çek (P)">📷</button>
<div id="confetti"></div>

<section id="sheet" aria-hidden="true">
  <div class="sheet-head" id="sheetHead">
    <div class="grab"></div>
    <div class="sheet-title"><h2 id="sheetTitle"></h2><button class="x" id="sheetClose" aria-label="Kapat">✕</button></div>
  </div>
  <div class="segs" id="sheetSegs"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div id="actionbar">
  <div id="abInfo"><div id="abTitle"></div><div id="abMsg"></div></div>
  <button class="abbtn" id="abRot" title="Döndür (R)">↻</button>
  <button class="abbtn" id="abMove" title="Taşı (M)">✋</button>
  <button class="abbtn" id="abSell" title="Sat">💸</button>
  <button class="abbtn" id="abCancel" title="Bitir (Esc)">✕</button>
  <button class="abbtn ok" id="abOk">✓</button>
</div>

<nav id="tabbar">
  <button data-sheet="build"><span class="e">🛠️</span>İnşa<i class="badge"></i></button>
  <button data-sheet="staff"><span class="e">👥</span>Ekip<i class="badge"></i></button>
  <button data-sheet="shop"><span class="e">☕</span>Dükkan<i class="badge"></i></button>
  <button data-sheet="hood"><span class="e">👋</span>Mahalle<i class="badge"></i></button>
  <button data-sheet="more"><span class="e">☰</span>Daha<i class="badge"></i></button>
</nav>

<div id="artGame"><b>🎨 Latte art! Koyu yeşilde dokun</b><div id="artTrack"><div id="artZone"></div><div id="artPerfect"></div><div id="artNeedle"></div></div><small>Tam ortada durdurursan mükemmel olur</small></div>
<div id="toasts"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
